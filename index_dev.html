<script>
const API_URL = 'https://systems-test.heatsense.workers.dev/api/system';

// Ships database
const SHIPS = [
  { name: 'HAF', hullmass: 81883000, c: 2.5 },
  { name: 'LORHA', hullmass: 31369320, c: 2.5 },
  { name: 'MAUL', hullmass: 548435920, c: 2.5 },
  { name: 'MCF', hullmass: 52313760, c: 2.5 },
  { name: 'TADES', hullmass: 74655480, c: 2.5 },
  { name: 'USV', hullmass: 30266600, c: 1.8 },
  { name: 'RECURVE', hullmass: 10400000, c: 1.0 },
  { name: 'REFLEX', hullmass: 9750000, c: 2.0 },
  { name: 'REIVER', hullmass: 10200000, c: 1.0 },
  { name: 'CAROM', hullmass: 7200000, c: 8.5 },
  { name: 'STRIDE', hullmass: 7900000, c: 8.0 },
  { name: 'CHUMAQ', hullmass: 1739489520, c: 3.0 }
];

function initializeShips() {
  const select = document.getElementById('shipSelect');
  SHIPS.forEach(ship => {
    const option = document.createElement('option');
    option.value = ship.name;
    option.textContent = ship.name;
    select.appendChild(option);
  });
}

function onShipChange() {
  const shipName = document.getElementById('shipSelect').value;
  if (!shipName) {
    document.getElementById('hullMass').value = '';
    document.getElementById('baseC').value = '';
    return;
  }
  const ship = SHIPS.find(s => s.name === shipName);
  if (ship) {
    document.getElementById('hullMass').value = (ship.hullmass / 1000000).toFixed(2) + 'M';
    document.getElementById('baseC').value = ship.c.toFixed(1);
    onSkillChange();
  }
}

function onSkillChange() {
  const skillLevel = parseInt(document.getElementById('skillLevel').value) || 0;
  const baseC = parseFloat(document.getElementById('baseC').value) || 0;
  const effectiveC = baseC > 0 ? baseC * (1 + skillLevel * 0.02) : 0;
  document.getElementById('skillValue').textContent = skillLevel;
  document.getElementById('effectiveC').textContent = effectiveC.toFixed(3);
}

// Event listeners
document.addEventListener('DOMContentLoaded', function() {
  initializeShips();
  document.getElementById('searchBtn').addEventListener('click', searchSystems);
  document.getElementById('shipSelect').addEventListener('change', onShipChange);
  document.getElementById('skillLevel').addEventListener('input', onSkillChange);
});

async function searchSystems() {
  const input = document.getElementById('systemInput').value.trim();
  const shipName = document.getElementById('shipSelect').value;
  const btn = document.getElementById('searchBtn');
  const resultDiv = document.getElementById('result');
  const errorDiv = document.getElementById('error');

  resultDiv.style.display = 'none';
  errorDiv.style.display = 'none';

  if (!input) {
    showError('Please enter at least one system name');
    return;
  }

  const systemNames = parseSystemInput(input);
  console.log('systemNames:', systemNames);
  console.log('systemNames.length:', systemNames ? systemNames.length : 'undefined');
  
  document.getElementById('systemInput').value = systemNames.join(', ');

  if (systemNames.length === 0) {
    showError('No valid system names found');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Checking...';
  resultDiv.innerHTML = `<div class="loading">🔍 Checking ${systemNames.length} system(s)...</div>`;
  resultDiv.style.display = 'block';

  try {
    // If ship is selected and 2+ systems, calculate route locally
    if (shipName && systemNames.length >= 2) {
      const ship = SHIPS.find(s => s.name === shipName);
      const totalMass = ship.hullmass;
      const skillLevel = parseInt(document.getElementById('skillLevel').value) || 0;
      const effectiveC = ship.c * (1 + skillLevel * 0.02);

      // Fetch all systems first
      const systems = [];
      for (const name of systemNames) {
        try {
          const url = `${API_URL}?name=${encodeURIComponent(name)}`;
          const response = await fetch(url);
          if (response.ok) {
            const data = await response.json();
            systems.push({ name, system: data.system });
          } else {
            showError(`System not found: ${name}`);
            return;
          }
        } catch (err) {
          showError(`Error fetching ${name}: ${err.message}`);
          return;
        }
      }

      // Calculate route heat
      const route = [];
      let totalLY = 0;
      const METERS_PER_LY = 9.46073e15;

      for (let i = 0; i < systems.length; i++) {
        const sys = systems[i];
        const lowHeat = sys.system.coldest_point.heat;
        const status = sys.system.status;

        let jumpHeatGen = 0;
        let totalAfter = lowHeat;
        let canJump = lowHeat <= 150;

        // Calculate distance to next system
        if (i < systems.length - 1) {
          const currentCoords = sys.system.coords;
          const nextCoords = systems[i + 1].system.coords;
          
          if (currentCoords && nextCoords) {
            const dx = nextCoords.x - currentCoords.x;
            const dy = nextCoords.y - currentCoords.y;
            const dz = nextCoords.z - currentCoords.z;
            const distM = Math.sqrt(dx*dx + dy*dy + dz*dz);
            const distLY = distM / METERS_PER_LY;
            totalLY += distLY;

            jumpHeatGen = (3 * totalMass * distLY) / (effectiveC * ship.hullmass);
            totalAfter = lowHeat + jumpHeatGen;
            canJump = totalAfter <= 150;
          }
        }

        route.push({
          name: sys.name,
          low_heat: lowHeat.toFixed(2),
          status: status,
          jump_heat_gen: jumpHeatGen.toFixed(2),
          total_after_jump: totalAfter.toFixed(2),
          can_jump: canJump
        });
      }

      // Display route table
      let html = `<div class="result-header">Route Analysis</div>`;
      html += `<div style="margin:15px 0;font-size:0.95em;">Total Distance: <strong>${totalLY.toFixed(2)} LY</strong> | Effective C: <strong>${effectiveC.toFixed(3)}</strong></div>`;
      html += `<table style="width:100%;border-collapse:collapse;margin:15px 0;">`;
      html += `<tr style="background:rgba(255,100,50,0.2);border-bottom:2px solid rgba(255,100,50,0.4);">`;
      html += `<th style="padding:10px;text-align:left;color:#ffaa77;">System</th>`;
      html += `<th style="padding:10px;text-align:center;">Low Heat</th>`;
      html += `<th style="padding:10px;text-align:center;">Jump Heat Gen</th>`;
      html += `<th style="padding:10px;text-align:center;">Total After</th>`;
      html += `<th style="padding:10px;text-align:center;">Status</th>`;
      html += `</tr>`;

      for (const sys of route) {
        const rowColor = sys.can_jump ? 'rgba(100,200,100,0.1)' : 'rgba(255,100,50,0.1)';
        html += `<tr style="background:${rowColor};border-bottom:1px solid rgba(255,100,50,0.2);">`;
        html += `<td style="padding:10px;"><strong>${sys.name}</strong></td>`;
        html += `<td style="padding:10px;text-align:center;">${sys.low_heat}</td>`;
        html += `<td style="padding:10px;text-align:center;">${sys.jump_heat_gen}</td>`;
        html += `<td style="padding:10px;text-align:center;color:${sys.can_jump ? '#6f6' : '#f66'}">${sys.total_after_jump}</td>`;
        html += `<td style="padding:10px;text-align:center;">${sys.status}</td>`;
        html += `</tr>`;
      }

      html += `</table>`;
      resultDiv.innerHTML = html;
      resultDiv.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Check Heat';
      return;
    }

    // Otherwise, check individual systems
    const results = [];
    for (const name of systemNames) {
      try {
        const url = `${API_URL}?name=${encodeURIComponent(name)}`;
        const response = await fetch(url);

        if (response.ok) {
          const data = await response.json();
          const s = data.system;

          // 🔥 NORMALIZATION LAYER (új worker → régi frontend struktúra)
          const normalizedSystem = {
            id: s.system_id,
            name: s.name,
            star_class: s.star_class,
            temperature: s.temperature,
            radius_km: s.radius_km,
            status: s.status,
            coords: s.coords,
            coldest_point: {
              distance_au: s.coldest_point.distance_au,
              distance_ls: s.coldest_point.distance_ls,
              heat: s.coldest_point.heat
            }
          };

          results.push({ name, system: normalizedSystem, model: data.model_version });
        } else {
          results.push({ name, error: 'Not found' });
        }
      } catch (err) {
        results.push({ name, error: err.message });
      }
    }

    if (results.length === 1 && !results[0].error) {
      displayResult(results[0].system, results[0].model);
    } else {
      displayMultipleResults(results);
    }
  } catch (error) {
    showError(error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Check Heat';
  }
}

function parseSystemInput(input) {
  const systems = new Set();
  let text = input;

  const temp = document.createElement('div');
  temp.innerHTML = text;
  text = temp.textContent || temp.innerText || text;

  text = text
    .replace(/→/g, ' ')
    .replace(/\|/g, ' ')
    .replace(/\*/g, ' ')
    .replace(/Gate:|SmartGate:|Jump:/gi, ' ')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/\[[^\]]*\]/g, ' ')
    .replace(/<[^>]*>/g, ' ')
    .replace(/[\d]+\.[\d]+/g, ' ')
    .replace(/\s+/g, ' ');

  const regex = /\b[A-Z0-9]{2,4}-[A-Z0-9]{2,4}\b/gi;
  const matches = text.match(regex);

  if (matches) {
    for (const m of matches) {
      systems.add(m.toUpperCase());
    }
  }

  return Array.from(systems);
}

function displayRoute(routeData) {
  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';

  console.log('displayRoute called with:', routeData);

  // Ha az API összegzett adat ad vissza (total_distance_ly, total_low_heat stb)
  // akkor azt jelenítem meg
  if (routeData.total_distance_ly && !routeData.route) {
    let html = `<div class="result-header">Route Summary</div>`;
    html += `<div style="margin:15px 0;font-size:0.95em;">`;
    html += `<div>Total Distance: <strong>${routeData.total_distance_ly} LY</strong></div>`;
    html += `<div>Total Low Heat: <strong>${routeData.total_low_heat}</strong></div>`;
    html += `<div>Avg Low Heat: <strong>${routeData.avg_low_heat}</strong></div>`;
    html += `<div>Max Low Heat: <strong>${routeData.max_low_heat}</strong></div>`;
    html += `<div>Worst Status: <strong>${routeData.worst_status}</strong></div>`;
    html += `</div>`;
    resultDiv.innerHTML = html;
    return;
  }

  if (!routeData || !routeData.route) {
    console.error('Invalid route data:', routeData);
    resultDiv.innerHTML = '<div class="error">Error: Invalid route data from API</div>';
    return;
  }

  let html = `<div class="result-header">Route Analysis</div>`;
  html += `<div style="margin:15px 0;font-size:0.95em;">Total Distance: <strong>${routeData.total_distance_ly} LY</strong> | Route Possible: <strong style="color:${routeData.can_complete_route ? '#6f6' : '#f66'}">${routeData.can_complete_route ? '✓ YES' : '✗ NO'}</strong></div>`;
  
  html += `<table style="width:100%;border-collapse:collapse;margin:15px 0;">`;
  html += `<tr style="background:rgba(255,100,50,0.2);border-bottom:2px solid rgba(255,100,50,0.4);">`;
  html += `<th style="padding:10px;text-align:left;color:#ffaa77;">System</th>`;
  html += `<th style="padding:10px;text-align:center;">Low Heat</th>`;
  html += `<th style="padding:10px;text-align:center;">Jump Heat Gen</th>`;
  html += `<th style="padding:10px;text-align:center;">Total After Jump</th>`;
  html += `<th style="padding:10px;text-align:center;">Status</th>`;
  html += `</tr>`;

  for (let i = 0; i < routeData.route.length; i++) {
    const sys = routeData.route[i];
    const canJump = sys.can_jump;
    const rowColor = canJump ? 'rgba(100,200,100,0.1)' : 'rgba(255,100,50,0.1)';
    
    html += `<tr style="background:${rowColor};border-bottom:1px solid rgba(255,100,50,0.2);">`;
    html += `<td style="padding:10px;"><strong>${sys.name}</strong></td>`;
    html += `<td style="padding:10px;text-align:center;">${sys.low_heat}</td>`;
    html += `<td style="padding:10px;text-align:center;">${sys.jump_heat_gen}</td>`;
    html += `<td style="padding:10px;text-align:center;color:${canJump ? '#6f6' : '#f66'}">${sys.total_after_jump}</td>`;
    html += `<td style="padding:10px;text-align:center;color:${canJump ? '#6f6' : '#f66'}">${canJump ? '✓' : '✗'}</td>`;
    html += `</tr>`;
  }

  html += `</table>`;
  resultDiv.innerHTML = html;
}

function displayResult(system, model) {
  const resultDiv = document.getElementById('result');
  const isTrap = system.coldest_point.heat >= 85;

  const statusConfig = {
    'SAFE': { class: 'status-safe', emoji: '✅' },
    'MODERATE': { class: 'status-moderate', emoji: '⚠️' },
    'DANGEROUS': { class: 'status-dangerous', emoji: '🔥' },
    'CRITICAL': { class: 'status-critical', emoji: '☠️' }
  };

  const config = statusConfig[system.status] || statusConfig['SAFE'];

  let trapWarningHTML = '';
  if (isTrap) {
    trapWarningHTML = `
      <div class="trap-warning">
        <div class="trap-title">⚠️ IT'S A TRAP?! ⚠️</div>
        <div class="trap-message">
          Even at the coldest accessible point (${system.coldest_point.distance_au.toFixed(2)} AU), 
          this system has dangerously high heat (${system.coldest_point.heat.toFixed(1)})!<br>
          <strong>WARNING:</strong> You may not be able to escape if your ship overheats.
        </div>
      </div>
    `;
  }

  resultDiv.innerHTML = `
    <div class="system-name">${system.name}</div>
    
    <div class="heat-display">
      <div class="heat-value">${system.coldest_point.heat.toFixed(1)}</div>
      <div class="heat-label">Heat Units at Coldest Point</div>
    </div>
    
    <div class="status-badge ${config.class}">
      ${config.emoji} ${system.status}
    </div>
    
    ${trapWarningHTML}
    
    <div class="details">
      <div class="detail-row">
        <span class="detail-label">Star Type:</span>
        <span class="detail-value">${system.star_class} (${system.temperature}K)</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Star Radius:</span>
        <span class="detail-value">${(system.radius_km / 1000000).toFixed(1)} M km</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Coldest Point:</span>
        <span class="detail-value">${system.coldest_point.distance_au.toFixed(2)} AU (${system.coldest_point.distance_ls.toFixed(0)} LS)</span>
      </div>
    </div>
    
    <div class="info-box">
      Read more: <a href="https://thoughtfolio.xyz/All+to+Avoid+Heat+Traps%2C+Exponential+Heat-Signature+Decay+Model" target="_blank" style="color:#6cf">Ergod's Research Paper</a>
    </div>
  `;
  
  resultDiv.style.display = 'block';
}

function displayMultipleResults(results) {
  const resultDiv = document.getElementById('result');
  const successCount = results.filter(r => !r.error).length;
  const trapCount = results.filter(r => !r.error && r.system?.coldest_point?.heat >= 85).length;

  let html = `
    <h2>Route Heat Check</h2>
    <p style="text-align:center;margin:15px 0;font-size:1.1em;color:#ffaa77">
      ${successCount} / ${results.length} systems found
      ${trapCount > 0 ? `| <span style="color:#ff6666">⚠️ ${trapCount} TRAP(s) detected!</span>` : ''}
    </p>
    
    <table class="route-table">
      <thead>
        <tr>
          <th>System</th>
          <th>Star</th>
          <th>Heat</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
  `;

  for (const result of results) {
    if (result.error) {
      html += `
        <tr>
          <td>${result.name}</td>
          <td colspan="3" style="color:#ff6666">❌ ${result.error}</td>
        </tr>
      `;
      continue;
    }

    const sys = result.system;
    const isTrap = sys.coldest_point.heat >= 85;

    const statusConfig = {
      'SAFE': { emoji: '✅' },
      'MODERATE': { emoji: '⚠️' },
      'DANGEROUS': { emoji: '🔥' },
      'CRITICAL': { emoji: '☠️' }
    };

    const config = statusConfig[sys.status] || statusConfig['SAFE'];

    html += `
      <tr>
        <td><strong>${sys.name}</strong></td>
        <td>${sys.star_class} (${sys.temperature}K)</td>
        <td class="heat-cell" style="color:${sys.coldest_point.heat >= 70 ? '#ff6666' : sys.coldest_point.heat >= 30 ? '#ffaa66' : '#aaffaa'}">
          ${sys.coldest_point.heat.toFixed(1)}
        </td>
        <td>
          ${config.emoji} ${sys.status}
          ${isTrap ? '<span class="trap-indicator trap-yes">⚠️ TRAP!</span>' : ''}
        </td>
      </tr>
    `;
  }

  html += `</tbody></table>`;

  resultDiv.innerHTML = html;
  resultDiv.style.display = 'block';
}

function showError(message) {
  const errorDiv = document.getElementById('error');
  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'none';
  errorDiv.innerHTML = `<strong>❌ Error:</strong> ${message}<br><small>Make sure the system name is correct. Try exact names like "O3H-1FN".</small>`;
  errorDiv.style.display = 'block';
}

// paste handler + auto clean
document.getElementById('systemInput').addEventListener('paste', function(e) {
  e.preventDefault();
  const text = (e.clipboardData || window.clipboardData).getData('text');
  const systems = parseSystemInput(text);
  this.value = systems.join(', ');
});

// Ctrl+Enter support
document.getElementById('systemInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
    e.preventDefault();
    searchSystems();
  }
});
</script>
