<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>High-Heat & TRAP Systems - HeatSense Arctangent v1.0</title>
    <style>
        body {
            background: linear-gradient(135deg, #0a0500 0%, #1a0a00 100%);
            color: #ffa366;
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 20px;
            min-height: 100vh;
        }
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding-bottom: 80px;
        }
        h1 {
            text-align: center;
            color: #ff6600;
            text-shadow: 0 0 20px rgba(255,102,0,0.5);
            font-size: 2.5em;
            margin-bottom: 5px;
        }
        .subtitle {
            text-align: center;
            color: #ffaa66;
            font-size: 1.1em;
            margin-bottom: 10px;
        }
        .model-badge {
            text-align: center;
            color: #6cf;
            font-size: 0.9em;
            margin-bottom: 20px;
        }
        .search-box {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background: #120700;
            border: 1px solid #ff6600;
            color: #ffa366;
            font-family: 'Courier New', monospace;
            border-radius: 6px;
            outline: none;
        }
        .search-box::placeholder { color: #cc7a44; }
        table {
            width: 100%;
            border-collapse: collapse;
            background: rgba(20,10,0,0.6);
            border: 2px solid #ff6600;
            box-shadow: 0 0 30px rgba(255,102,0,0.3);
        }
        th, td {
            padding: 12px;
            text-align: left;
            border-bottom: 1px solid rgba(255,102,0,0.3);
        }
        th {
            background: rgba(255,102,0,0.2);
            color: #ff6600;
            font-weight: bold;
            position: sticky;
            top: 0;
            z-index: 10;
        }
        tr:hover { background: rgba(255,102,0,0.1); }
        .trap-yes {
            color: #ff0000;
            font-weight: bold;
            text-shadow: 0 0 5px rgba(255,0,0,0.5);
        }
        .trap-danger {
            color: #ff8800;
            font-weight: bold;
        }
        .back-link {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 999;
            display: block;
            text-align: center;
            color: #6cf;
            text-decoration: none;
            font-size: 1.05em;
            padding: 12px 24px;
            border: 2px solid rgba(102,204,255,0.3);
            border-radius: 10px;
            background: rgba(102,204,255,0.08);
            transition: all 0.3s;
            backdrop-filter: blur(4px);
        }
        .back-link:hover {
            color: #8ef;
            border-color: rgba(102,204,255,0.6);
            background: rgba(102,204,255,0.15);
        }
        .loading {
            text-align: center;
            padding: 30px;
            color: #ffaa66;
            font-size: 1.2em;
        }
        .error {
            text-align: center;
            padding: 30px;
            color: #ff4444;
            font-size: 1.1em;
        }
    </style>
</head>
<body>
<div class="container">
    <h1>⚠️ HIGH-HEAT & TRAP SYSTEMS</h1>
    <div class="subtitle">🔥 Danger ≥ 85 | ☠️ TRAP ≥ 90</div>
    <div class="model-badge">🔬 Ergod Arctangent Model v1.0 | MAE 1.45 Heat</div>

    <input id="search" class="search-box" placeholder="Search system name..." />

    <table>
        <thead>
            <tr>
                <th>System Name</th>
                <th>Star Class</th>
                <th>Temperature (K)</th>
                <th>Orbit</th>
                <th>Heat</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <tr><td colspan="6" class="loading">Loading data from HeatSense API...</td></tr>
        </tbody>
    </table>
</div>

<a href="index.html" class="back-link">← Back to HeatSense</a>

<script>
const API = 'https://systems.heatsense.workers.dev/api/highheat';
// ha ugyanazon domainen fut:
// const API = '/api/highheat';

const tbody = document.getElementById('tableBody');
const searchInput = document.getElementById('search');

let systems = [];

fetch(API)
  .then(r => {
    if(!r.ok) throw new Error('API error ' + r.status);
    return r.json();
  })
  .then(data => {
    systems = data;
    render(data);
  })
  .catch(err => {
    console.error(err);
    tbody.innerHTML = `<tr><td colspan="6" class="error">Failed to load data from API</td></tr>`;
  });

function render(list){
  tbody.innerHTML = '';

  if(list.length === 0){
    tbody.innerHTML = `<tr><td colspan="6" class="loading">No systems above danger threshold</td></tr>`;
    return;
  }

  list.forEach(s => {
    const tr = document.createElement('tr');

    const orbit = (Number(s.au) === 0 || s.au === "0.00")
      ? `${s.ls} LS`
      : `${s.au} AU`;

    let statusHtml = '';
    if (s.status === 'TRAP') {
      statusHtml = `<span class="trap-yes">☠️ TRAP!</span>`;
    } else {
      statusHtml = `<span class="trap-danger">🔥 DANGER</span>`;
    }

    tr.innerHTML = `
      <td>${s.name}</td>
      <td>${s.star}</td>
      <td>${s.temp}</td>
      <td>${orbit}</td>
      <td>${Number(s.heat).toFixed(2)}</td>
      <td>${statusHtml}</td>
    `;

    tbody.appendChild(tr);
  });
}

searchInput.addEventListener('input', e => {
  const v = e.target.value.toLowerCase();
  const filtered = systems.filter(s => s.name.toLowerCase().includes(v));
  render(filtered);
});
</script>
</body>
</html>
