<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVE Frontier :: HeatSense - System Lookup</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:radial-gradient(ellipse at 30% 20%, rgba(80,20,10,0.4) 0%, transparent 50%),radial-gradient(ellipse at 70% 80%, rgba(120,30,0,0.3) 0%, transparent 50%),radial-gradient(ellipse at 50% 50%, rgba(60,10,5,0.5) 0%, transparent 70%),linear-gradient(135deg, #0a0505 0%, #1a0a0a 50%, #0f0505 100%);min-height:100vh;padding:20px;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,0.8),transparent),radial-gradient(2px 2px at 60% 70%,rgba(255,255,255,0.6),transparent),radial-gradient(1px 1px at 50% 50%,rgba(255,255,255,0.9),transparent);background-size:200px 200px,300px 300px,150px 150px;opacity:0.7;z-index:0}
.container{max-width:700px;width:100%;background:rgba(25,15,10,.9);backdrop-filter:blur(10px);border-radius:20px;padding:40px;box-shadow:0 8px 32px 0 rgba(255,100,0,.3);border:1px solid rgba(255,100,50,.3);position:relative;z-index:1}
h1{text-align:center;margin-bottom:10px;font-size:2.2em;color:#ffaa77;font-weight:600}
.subtitle{text-align:center;margin-bottom:15px;font-size:1em;color:#ffccaa}
.version{text-align:center;margin-bottom:20px;font-size:0.85em;color:#aa8866;font-style:italic}
.info-banner{background:rgba(100,150,255,.15);border:2px solid rgba(100,150,255,.4);border-radius:12px;padding:15px;margin-bottom:25px;text-align:center}
.info-banner p{color:#cce5ff;font-size:.9em;line-height:1.5;margin-bottom:8px}
.input-group{margin-bottom:25px}
label{display:block;margin-bottom:8px;font-weight:600;font-size:1em;color:#ffaa77}
input[type="text"]{width:100%;padding:14px;font-size:1.1em;border:2px solid rgba(255,100,50,.3);border-radius:10px;background:rgba(10,5,0,.6);color:#ffddcc;transition:all .3s}
input[type="text"]:focus{outline:none;border-color:#f60;background:rgba(20,10,5,.8);box-shadow:0 0 15px rgba(255,100,0,.3)}
input[type="text"]::placeholder{color:#aa8866}
.btn{width:100%;padding:16px;font-size:1.2em;font-weight:bold;background:linear-gradient(135deg,#f60 0%,#c30 100%);color:#fff;border:none;border-radius:10px;cursor:pointer;transition:all .3s;margin-top:10px;box-shadow:0 4px 15px rgba(255,100,0,.4)}
.btn:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 6px 25px rgba(255,100,0,.6)}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none}
.result{margin-top:35px;padding:25px;background:rgba(30,15,10,.8);border-radius:15px;border:2px solid rgba(255,100,50,.3);display:none;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.result h2{margin-bottom:15px;text-align:center;font-size:1.5em;color:#ffaa77}
.system-name{text-align:center;font-size:1.3em;color:#6cf;margin-bottom:15px;font-weight:600}
.heat-value{text-align:center;font-size:3.5em;font-weight:bold;margin:15px 0;color:#ff8844;text-shadow:0 0 20px rgba(255,100,0,.6)}
.zone{text-align:center;font-size:1.3em;padding:12px;border-radius:10px;margin:15px 0;font-weight:bold}
.zone-safe{background:rgba(50,150,50,.3);border:2px solid #5f5;box-shadow:0 0 15px rgba(50,255,50,.3);color:#aaffaa}
.zone-moderate{background:rgba(200,150,0,.3);border:2px solid #fc0;box-shadow:0 0 15px rgba(255,200,0,.3);color:#ffffaa}
.zone-dangerous{background:rgba(255,100,0,.3);border:2px solid #f60;box-shadow:0 0 15px rgba(255,100,0,.4);color:#ffccaa}
.zone-critical{background:rgba(255,0,0,.4);border:2px solid red;animation:pulse 2s infinite;box-shadow:0 0 25px rgba(255,0,0,.6);color:#ffaaaa}
@keyframes pulse{0%,100%{box-shadow:0 0 25px rgba(255,0,0,.6)}50%{box-shadow:0 0 40px rgba(255,0,0,.9)}}
.details{background:rgba(0,0,0,.4);padding:15px;border-radius:10px;margin-top:15px;font-size:.95em;border:1px solid rgba(255,100,50,.2)}
.details p{margin:6px 0;color:#ffddcc}
.warning{background:rgba(255,100,0,.2);border-left:4px solid #f60;padding:12px;margin-top:15px;border-radius:5px;font-size:.9em;color:#ffddcc}
.error{background:rgba(255,50,50,.2);border:2px solid #f33;padding:15px;border-radius:10px;margin-top:15px;color:#ffaaaa}
.info-note{background:rgba(100,200,255,.1);border:1px solid rgba(100,200,255,.3);padding:12px;border-radius:8px;margin-top:15px;font-size:.85em;color:#ccddff;line-height:1.6}
</style>
</head>
<body>
<div class="container">
<h1>EVE Frontier :: HeatSense</h1>
<p class="subtitle">System Coldest Point Calculator</p>
<p class="version">v7.0 - 24,023 systems | Powered by Cloudflare</p>

<div class="info-banner">
<p>🌡️ Find the coldest accessible point in any solar system!</p>
<p>Enter system name (e.g., "J-PFM2") or System ID (e.g., "30000004")</p>
</div>

<div class="input-group">
<label for="systemInput">System Name or ID:</label>
<input type="text" id="systemInput" placeholder="J-PFM2 or 30000004" autocomplete="off">
</div>
<button class="btn" onclick="lookupSystem()" id="lookupBtn">Find Coldest Point</button>

<div id="result" class="result"></div>

</div>

<script>
// CONFIGURATION - Update this after deploying Cloudflare Worker
const API_URL = 'https://heatsense-api.heatsense.workers.dev/api/lookup';

// For local testing, use sample data
const USE_LOCAL_DATA = true; // Set to false when API is deployed

async function lookupSystem() {
    const input = document.getElementById('systemInput').value.trim();
    if(!input) {
        alert('Please enter a system name or ID');
        return;
    }
    
    const btn = document.getElementById('lookupBtn');
    const resultDiv = document.getElementById('result');
    
    btn.disabled = true;
    btn.textContent = 'Searching...';
    
    // Show loading
    resultDiv.innerHTML = '<div style="text-align:center;padding:20px;color:#ffaa77">🔍 Searching system database...</div>';
    resultDiv.style.display = 'block';
    
    try {
        let data;
        
        if (USE_LOCAL_DATA) {
            // Local demo data for testing
            data = await getLocalData(input);
        } else {
            // Query actual Cloudflare Worker API
            const response = await fetch(`${API_URL}?system=${encodeURIComponent(input)}`);
            
            if (!response.ok) {
                const error = await response.json();
                throw new Error(error.error || 'API request failed');
            }
            
            data = await response.json();
        }
        
        displayResult(input, data);
        
    } catch (error) {
        resultDiv.innerHTML = `
            <div class="error">
                <strong>❌ Error:</strong> ${error.message}
                <p style="margin-top:10px;font-size:0.9em">
                ${error.message.includes('not found') 
                    ? 'Make sure the system name is correct. Try partial names like "J-PF" or use System ID.'
                    : 'The service might be temporarily unavailable. Please try again.'}
                </p>
            </div>
        `;
    } finally {
        btn.disabled = false;
        btn.textContent = 'Find Coldest Point';
    }
}

async function getLocalData(input) {
    // Demo data for testing before API deployment
    const demoSystems = {
        '30000004': { systemId: 30000004, star: { class: 'G0', temperature: 6136 }, coldestPoint: { distanceAU: 32.16, heat: 7.6 }, status: 'SAFE' },
        '30000005': { systemId: 30000005, star: { class: 'M0', temperature: 3939 }, coldestPoint: { distanceAU: 1.59, heat: 26.4 }, status: 'SAFE' },
        '30000006': { systemId: 30000006, star: { class: 'G5', temperature: 5744 }, coldestPoint: { distanceAU: 1.29, heat: 62.6 }, status: 'DANGEROUS' }
    };
    
    // Simulate API delay
    await new Promise(resolve => setTimeout(resolve, 500));
    
    const data = demoSystems[input];
    if (!data) {
        throw new Error(`System "${input}" not found in demo data. Try: 30000004, 30000005, or 30000006`);
    }
    
    return data;
}

function displayResult(systemName, data) {
    const heat = data.coldestPoint.heat;
    
    let zone, zoneClass, zoneEmoji;
    if (heat < 30) {
        zone = 'Safe Zone';
        zoneClass = 'zone-safe';
        zoneEmoji = '✅';
    } else if (heat < 60) {
        zone = 'High Load';
        zoneClass = 'zone-moderate';
        zoneEmoji = '⚠️';
    } else if (heat < 80) {
        zone = 'Dangerous';
        zoneClass = 'zone-dangerous';
        zoneEmoji = '🔥';
    } else {
        zone = 'Critical';
        zoneClass = 'zone-critical';
        zoneEmoji = '☠️';
    }
    
    let warningHtml = '';
    if (heat >= 60) {
        const warningText = heat >= 80 
            ? '☠️ CRITICAL: Even at the coldest point, this system is extremely dangerous! Operations not recommended.'
            : '⚠️ WARNING: High heat even at coldest point. Plan operations carefully and use cooling modules.';
        warningHtml = `<div class="warning">${warningText}</div>`;
    }
    
    document.getElementById('result').innerHTML = `
        <h2>System Analysis</h2>
        <div class="system-name">System ${systemName.toUpperCase()}</div>
        <div class="heat-value">${heat.toFixed(1)}</div>
        <div class="zone ${zoneClass}">${zoneEmoji} ${zone}</div>
        <div class="details">
            <p><strong>Star:</strong> ${data.star.class} (${data.star.temperature}K)</p>
            <p><strong>Coldest Point:</strong> ${data.coldestPoint.distanceAU.toFixed(2)} AU</p>
            <p><strong>Location:</strong> Outermost planet orbit</p>
            <p><strong>Status:</strong> ${data.status}</p>
        </div>
        ${warningHtml}
        <div class="info-note">
            <strong>ℹ️ About this calculation:</strong><br>
            Heat calculated at the outermost planet's orbital distance. This represents the coldest accessible point in the system for mining and operations. Actual in-game heat may vary slightly based on your exact position and ship modules.
        </div>
    `;
}

// Enter key support
document.getElementById('systemInput').addEventListener('keypress', function(e) {
    if(e.key === 'Enter') lookupSystem();
});

// Auto-focus input
document.getElementById('systemInput').focus();
</script>
</body>
</html>
