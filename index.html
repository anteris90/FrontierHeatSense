<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVE Frontier :: HeatSense</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:radial-gradient(ellipse at 30% 20%, rgba(80,20,10,0.4) 0%, transparent 50%),radial-gradient(ellipse at 70% 80%, rgba(120,30,0,0.3) 0%, transparent 50%),radial-gradient(ellipse at 50% 50%, rgba(60,10,5,0.5) 0%, transparent 70%),linear-gradient(135deg, #0a0505 0%, #1a0a0a 50%, #0f0505 100%);min-height:100vh;padding:20px;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,0.8),transparent),radial-gradient(2px 2px at 60% 70%,rgba(255,255,255,0.6),transparent),radial-gradient(1px 1px at 50% 50%,rgba(255,255,255,0.9),transparent),radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,0.7),transparent),radial-gradient(2px 2px at 90% 60%,rgba(255,255,255,0.5),transparent),radial-gradient(1px 1px at 33% 85%,rgba(255,255,255,0.8),transparent),radial-gradient(1px 1px at 75% 28%,rgba(255,255,255,0.6),transparent),radial-gradient(2px 2px at 15% 95%,rgba(255,255,255,0.9),transparent),radial-gradient(1px 1px at 45% 15%,rgba(255,255,255,0.7),transparent);background-size:200px 200px,300px 300px,150px 150px,250px 250px,180px 180px,220px 220px,280px 280px,190px 190px,240px 240px;background-position:0 0,40px 60px,130px 270px,70px 100px,150px 50px,90px 180px,200px 30px,50px 150px,180px 90px;opacity:0.7;z-index:0}
.container{max-width:600px;width:100%;background:rgba(25,15,10,.9);backdrop-filter:blur(10px);border-radius:20px;padding:40px;box-shadow:0 8px 32px 0 rgba(255,100,0,.3),0 0 80px rgba(255,50,0,.1);border:1px solid rgba(255,100,50,.3);position:relative;z-index:1}
h1{text-align:center;margin-bottom:10px;font-size:2.2em;color:#ffaa77;font-weight:600}
.subtitle{text-align:center;margin-bottom:15px;font-size:1em;color:#ffccaa}
.version{text-align:center;margin-bottom:20px;font-size:0.85em;color:#aa8866;font-style:italic}
.info-banner{background:rgba(100,150,255,.15);border:2px solid rgba(100,150,255,.4);border-radius:12px;padding:15px;margin-bottom:25px;text-align:center}
.info-banner p{color:#cce5ff;font-size:.9em;line-height:1.5;margin-bottom:10px}
.info-banner a{color:#6cf;font-weight:600;text-decoration:none;transition:all .3s;display:inline-flex;align-items:center;gap:5px}
.info-banner a:hover{color:#9df;text-shadow:0 0 10px rgba(100,200,255,.5)}
.input-group{margin-bottom:25px;position:relative}
label{display:block;margin-bottom:8px;font-weight:600;font-size:1em;color:#ffaa77}
.distance-wrapper{display:flex;gap:10px;align-items:stretch}
.distance-wrapper input{flex:1}
.unit-selector{display:flex;background:rgba(20,10,5,.6);border:2px solid rgba(255,100,50,.3);border-radius:8px;overflow:hidden}
.unit-btn{padding:10px 20px;background:transparent;border:none;color:#ffaa77;cursor:pointer;transition:all .3s;font-size:.9em;font-weight:600}
.unit-btn.active{background:rgba(255,100,0,.3);color:#fff}
.unit-btn:hover:not(.active){background:rgba(255,100,0,.15)}
input[type="number"]{width:100%;padding:14px;font-size:1.1em;border:2px solid rgba(255,100,50,.3);border-radius:10px;background:rgba(10,5,0,.6);color:#ffddcc;transition:all .3s}
input[type="number"]:focus{outline:none;border-color:#f60;background:rgba(20,10,5,.8);box-shadow:0 0 15px rgba(255,100,0,.3)}
input[type="number"]::placeholder{color:#aa8866}
.btn{width:100%;padding:16px;font-size:1.2em;font-weight:bold;background:linear-gradient(135deg,#f60 0%,#c30 100%);color:#fff;border:none;border-radius:10px;cursor:pointer;transition:all .3s;margin-top:10px;box-shadow:0 4px 15px rgba(255,100,0,.4)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(255,100,0,.6);background:linear-gradient(135deg,#f70 0%,#d40 100%)}
.btn:active{transform:translateY(0)}
.result{margin-top:35px;padding:25px;background:rgba(30,15,10,.8);border-radius:15px;border:2px solid rgba(255,100,50,.3);display:none;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.result h2{margin-bottom:15px;text-align:center;font-size:1.5em;color:#ffaa77}
.heat-value{text-align:center;font-size:3.5em;font-weight:bold;margin:15px 0;color:#ff8844;text-shadow:0 0 20px rgba(255,100,0,.6)}
.zone{text-align:center;font-size:1.3em;padding:12px;border-radius:10px;margin:15px 0;font-weight:bold}
.zone-safe{background:rgba(50,150,50,.3);border:2px solid #5f5;box-shadow:0 0 15px rgba(50,255,50,.3);color:#aaffaa}
.zone-moderate{background:rgba(200,150,0,.3);border:2px solid #fc0;box-shadow:0 0 15px rgba(255,200,0,.3);color:#ffffaa}
.zone-dangerous{background:rgba(255,100,0,.3);border:2px solid #f60;box-shadow:0 0 15px rgba(255,100,0,.4);color:#ffccaa}
.zone-critical{background:rgba(255,0,0,.4);border:2px solid red;animation:pulse 2s infinite;box-shadow:0 0 25px rgba(255,0,0,.6);color:#ffaaaa}
@keyframes pulse{0%,100%{box-shadow:0 0 25px rgba(255,0,0,.6)}50%{box-shadow:0 0 40px rgba(255,0,0,.9)}}
.details{background:rgba(0,0,0,.4);padding:15px;border-radius:10px;margin-top:15px;font-size:.95em;border:1px solid rgba(255,100,50,.2)}
.details p{margin:6px 0;color:#ffddcc}
.warning{background:rgba(255,100,0,.2);border-left:4px solid #f60;padding:12px;margin-top:15px;border-radius:5px;font-size:.9em;color:#ffddcc}
.model-note{background:rgba(100,200,255,.15);border-left:3px solid #6cf;padding:10px;margin-top:15px;border-radius:5px;font-size:.82em;color:#ccddff;line-height:1.6}
.accuracy-badge{background:rgba(50,255,100,.2);border:1px solid rgba(50,255,100,.4);padding:8px 12px;border-radius:8px;display:inline-block;margin-top:10px;font-size:.9em;color:#aaffcc}
</style>
</head>
<body>
<div class="container">
<h1>EVE Frontier :: HeatSense</h1>
<p class="subtitle">Universal Exponential Model</p>
<p class="version">Based on 184 measurements with metallicity data</p>

<div class="info-banner">
<p>🗺️ Need star temperature and distance data before jumping?</p>
<a href="https://ef-map.com/" target="_blank" rel="noopener noreferrer">
Visit Lacal's Starmap →
</a>
</div>

<div class="input-group">
<label for="temp">Star Temperature (K):</label>
<input type="number" id="temp" placeholder="e.g. 5530" min="1500" max="15000" autofocus>
</div>
<div class="input-group">
<label>Distance:</label>
<div class="distance-wrapper">
<input type="number" id="distance" placeholder="e.g. 6.26 or 2104" min="0.01" step="0.01">
<div class="unit-selector">
<button class="unit-btn active" onclick="setUnit('AU')">AU</button>
<button class="unit-btn" onclick="setUnit('LS')">LS</button>
</div>
</div>
</div>
<button class="btn" onclick="calc()">Calculate Heat</button>
<div id="result" class="result">
<h2>Estimated Heat</h2>
<div id="heatValue" class="heat-value"></div>
<div id="zone" class="zone"></div>
<div class="details">
<p><strong>Distance:</strong> <span id="distDisplay"></span></p>
<p><strong>Range:</strong> <span id="range"></span></p>
<p><strong>Star Type:</strong> <span id="starType"></span></p>
</div>
<div id="warning" class="warning" style="display:none;"></div>
<div id="accuracyBadge" class="accuracy-badge"></div>
<div id="modelNote" class="model-note"></div>
</div>
</div>
<script>
let currentUnit = 'AU';

function setUnit(unit){
    currentUnit = unit;
    document.querySelectorAll('.unit-btn').forEach(btn => {
        btn.classList.remove('active');
    });
    event.target.classList.add('active');
    
    const distInput = document.getElementById('distance');
    if(unit === 'AU'){
        distInput.placeholder = 'e.g. 6.26';
        distInput.step = '0.01';
    } else {
        distInput.placeholder = 'e.g. 2104';
        distInput.step = '1';
    }
}

function calc(){
    const temp = parseFloat(document.getElementById('temp').value);
    let dist = parseFloat(document.getElementById('distance').value);
    
    if(!temp || !dist){
        alert('Please enter temperature and distance!');
        return;
    }
    
    const distLS = currentUnit === 'LS' ? dist : dist * 336;
    const distAU = currentUnit === 'AU' ? dist : dist / 336;
    
    // ========================================================================
    // UNIVERSAL EXPONENTIAL MODEL v6.1 (Default)
    // ========================================================================
    const lambda = 2.21e9 / Math.pow(temp, 2.613);
    const A = 85.0;
    const B = 0.000791 * temp + 2.694;
    
    let heat = A * Math.exp(-lambda * distAU) + B;
    
    // Determine star type
    let starType;
    if(temp < 3900) starType = 'M-type (red dwarf)';
    else if(temp < 5200) starType = 'K-type (orange dwarf)';
    else if(temp < 6000) starType = 'G-type (yellow dwarf)';
    else if(temp < 7500) starType = 'F-type (yellow-white)';
    else if(temp < 10000) starType = 'A-type (white)';
    else starType = 'B-type (blue-white)';
    
    /* ======================================================================
       ALTERNATIVE MODELS - Hidden but available for debugging/comparison
       ======================================================================
       
       // MIX MODEL (4-tier Power Law) - MAE: 7.49
       function calcMix(temp, distAU) {
           let heat;
           if(temp < 6000){
               const tempFactor = Math.pow(temp/3000, 1.03);
               const distFactor = Math.pow(distAU, 0.334);
               heat = 26.46 * tempFactor / distFactor;
           } else if(temp < 7500){
               const tempFactor = Math.pow(temp/3000, 0.031);
               const distFactor = Math.pow(distAU, 0.446);
               heat = 79.67 * tempFactor / distFactor;
           } else {
               if(distAU < 3){
                   const tempFactor = Math.pow(temp/3000, 0.412);
                   const distFactor = Math.pow(distAU, 0.064);
                   heat = 55.88 * tempFactor / distFactor;
               } else {
                   const tempFactor = Math.pow(temp/3000, 0.896);
                   const distFactor = Math.pow(distAU, 0.585);
                   heat = 62.81 * tempFactor / distFactor;
               }
           }
           if(heat > 100) heat = 100;
           return heat;
       }
       
       // PER-CLASS EXPONENTIAL (from Ergod) - MAE: 7.06
       function calcExponential(temp, distAU) {
           let A, lambda, B;
           if(temp < 3900){
               A = 77.75; lambda = 1.97340; B = 5.88;
           } else if(temp < 5200){
               A = 92.46; lambda = 0.78511; B = 4.38;
           } else if(temp < 6000){
               A = 77.90; lambda = 0.32233; B = 8.04;
           } else if(temp < 7500){
               A = 89.46; lambda = 0.18944; B = 8.06;
           } else {
               A = 87.12; lambda = 0.09097; B = 10.37;
           }
           return A * Math.exp(-lambda * distAU) + B;
       }
       
       Usage: Uncomment and call calcMix(temp, distAU) or calcExponential(temp, distAU)
       to compare with Universal model for debugging purposes.
    */
    
    heat = Math.round(heat * 10) / 10;
    
    const rangeMin = Math.max(0.1, Math.round(heat * 0.85 * 10) / 10);
    const rangeMax = Math.round(heat * 1.15 * 10) / 10;
    
    let zone, zoneClass, zoneEmoji;
    if(heat < 30){
        zone = 'Safe';
        zoneClass = 'zone-safe';
        zoneEmoji = '🟢';
    } else if(heat < 60){
        zone = 'High Load';
        zoneClass = 'zone-moderate';
        zoneEmoji = '🟡';
    } else if(heat < 80){
        zone = 'Dangerous';
        zoneClass = 'zone-dangerous';
        zoneEmoji = '🔴';
    } else {
        zone = 'Supercritical';
        zoneClass = 'zone-critical';
        zoneEmoji = '☠️';
    }
    
    document.getElementById('heatValue').textContent = heat.toFixed(1);
    document.getElementById('zone').textContent = zoneEmoji + ' ' + zone;
    document.getElementById('zone').className = 'zone ' + zoneClass;
    document.getElementById('distDisplay').textContent = distAU.toFixed(2) + ' AU (' + Math.round(distLS) + ' LS)';
    document.getElementById('range').textContent = rangeMin + ' - ' + rangeMax;
    document.getElementById('starType').textContent = starType;
    
    const accuracyText = '⭐ Universal Model: 82% <10 Heat | 51% <5 Heat | MAE: 6.95';
    document.getElementById('accuracyBadge').textContent = accuracyText;
    
    const modelDesc = '<strong>Universal Exponential Model:</strong><br>' +
        'Heat = A×e^(-λ×D) + B<br>' +
        '• λ(T) = 2.21×10⁹ / T^2.61 (stellar wind decay)<br>' +
        '• A = 85 (amplitude normalization)<br>' +
        '• B(T) = 0.000791×T + 2.7 (background radiation)<br>' +
        '• Smooth transitions, no class boundaries<br>' +
        '• Based on 184 measurements across 52 star systems<br>' +
        '• Metallicity-aware dataset';
    document.getElementById('modelNote').innerHTML = modelDesc;
    
    const warning = document.getElementById('warning');
    if(heat >= 60){
        warning.innerHTML = heat >= 80 
            ? '⚠️ <strong>SUPERCRITICAL!</strong> Jump distance severely limited - easily reaches 150 Heat limit!'
            : '⚠️ <strong>DANGEROUS!</strong> Jump distance limited, plan short jumps carefully.';
        warning.style.display = 'block';
    } else {
        warning.style.display = 'none';
    }
    
    document.getElementById('result').style.display = 'block';
}

['temp','distance'].forEach(id=>{
    document.getElementById(id).addEventListener('keypress',function(e){
        if(e.key === 'Enter') calc();
    });
});
</script>
</body>
</html>
