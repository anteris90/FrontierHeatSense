<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>EVE Frontier Heat Calculator - WIP only for testing</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;background:radial-gradient(ellipse at 30% 20%, rgba(80,20,10,0.4) 0%, transparent 50%),radial-gradient(ellipse at 70% 80%, rgba(120,30,0,0.3) 0%, transparent 50%),radial-gradient(ellipse at 50% 50%, rgba(60,10,5,0.5) 0%, transparent 70%),linear-gradient(135deg, #0a0505 0%, #1a0a0a 50%, #0f0505 100%);min-height:100vh;padding:20px;color:#fff;display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
body::before{content:"";position:fixed;top:0;left:0;width:100%;height:100%;background-image:radial-gradient(2px 2px at 20% 30%,rgba(255,255,255,0.8),transparent),radial-gradient(2px 2px at 60% 70%,rgba(255,255,255,0.6),transparent),radial-gradient(1px 1px at 50% 50%,rgba(255,255,255,0.9),transparent),radial-gradient(1px 1px at 80% 10%,rgba(255,255,255,0.7),transparent),radial-gradient(2px 2px at 90% 60%,rgba(255,255,255,0.5),transparent),radial-gradient(1px 1px at 33% 85%,rgba(255,255,255,0.8),transparent),radial-gradient(1px 1px at 75% 28%,rgba(255,255,255,0.6),transparent),radial-gradient(2px 2px at 15% 95%,rgba(255,255,255,0.9),transparent),radial-gradient(1px 1px at 45% 15%,rgba(255,255,255,0.7),transparent);background-size:200px 200px,300px 300px,150px 150px,250px 250px,180px 180px,220px 220px,280px 280px,190px 190px,240px 240px;background-position:0 0,40px 60px,130px 270px,70px 100px,150px 50px,90px 180px,200px 30px,50px 150px,180px 90px;opacity:0.7;z-index:0}
.container{max-width:600px;width:100%;background:rgba(25,15,10,.9);backdrop-filter:blur(10px);border-radius:20px;padding:40px;box-shadow:0 8px 32px 0 rgba(255,100,0,.3),0 0 80px rgba(255,50,0,.1);border:1px solid rgba(255,100,50,.3);position:relative;z-index:1}
h1{text-align:center;margin-bottom:10px;font-size:2.2em;color:#ffaa77;font-weight:600}
.subtitle{text-align:center;margin-bottom:35px;font-size:1em;color:#ffccaa}
.input-group{margin-bottom:25px}
label{display:block;margin-bottom:8px;font-weight:600;font-size:1em;color:#ffaa77}
input{width:100%;padding:14px;font-size:1.1em;border:2px solid rgba(255,100,50,.3);border-radius:10px;background:rgba(10,5,0,.6);color:#ffddcc;transition:all .3s}
input:focus{outline:none;border-color:#f60;background:rgba(20,10,5,.8);box-shadow:0 0 15px rgba(255,100,0,.3)}
input::placeholder{color:#aa8866}
.btn{width:100%;padding:16px;font-size:1.2em;font-weight:bold;background:linear-gradient(135deg,#f60 0%,#c30 100%);color:#fff;border:none;border-radius:10px;cursor:pointer;transition:all .3s;margin-top:10px;box-shadow:0 4px 15px rgba(255,100,0,.4)}
.btn:hover{transform:translateY(-2px);box-shadow:0 6px 25px rgba(255,100,0,.6);background:linear-gradient(135deg,#f70 0%,#d40 100%)}
.btn:active{transform:translateY(0)}
.result{margin-top:35px;padding:25px;background:rgba(30,15,10,.8);border-radius:15px;border:2px solid rgba(255,100,50,.3);display:none;animation:fadeIn .5s}
@keyframes fadeIn{from{opacity:0;transform:translateY(-10px)}to{opacity:1;transform:translateY(0)}}
.result h2{margin-bottom:15px;text-align:center;font-size:1.5em;color:#ffaa77}
.heat-value{text-align:center;font-size:3.5em;font-weight:bold;margin:15px 0;color:#ff8844;text-shadow:0 0 20px rgba(255,100,0,.6)}
.zone{text-align:center;font-size:1.3em;padding:12px;border-radius:10px;margin:15px 0;font-weight:bold}
.zone-safe{background:rgba(50,150,50,.3);border:2px solid #5f5;box-shadow:0 0 15px rgba(50,255,50,.3);color:#aaffaa}
.zone-moderate{background:rgba(200,150,0,.3);border:2px solid #fc0;box-shadow:0 0 15px rgba(255,200,0,.3);color:#ffffaa}
.zone-dangerous{background:rgba(255,100,0,.3);border:2px solid #f60;box-shadow:0 0 15px rgba(255,100,0,.4);color:#ffccaa}
.zone-critical{background:rgba(255,0,0,.4);border:2px solid red;animation:pulse 2s infinite;box-shadow:0 0 25px rgba(255,0,0,.6);color:#ffaaaa}
@keyframes pulse{0%,100%{box-shadow:0 0 25px rgba(255,0,0,.6)}50%{box-shadow:0 0 40px rgba(255,0,0,.9)}}
.details{background:rgba(0,0,0,.4);padding:15px;border-radius:10px;margin-top:15px;font-size:.95em;border:1px solid rgba(255,100,50,.2)}
.details p{margin:6px 0;color:#ffddcc}
.warning{background:rgba(255,100,0,.2);border-left:4px solid #f60;padding:12px;margin-top:15px;border-radius:5px;font-size:.9em;color:#ffddcc}
.hint{text-align:center;font-size:.85em;opacity:.7;margin-top:5px;color:#bbaa99}
</style>
</head>
<body>
<div class="container">
<h1>EVE Frontier Heat Calculator - WIP only for testing</h1>
<p class="subtitle">Estimate external heat based on star data</p>
<div class="input-group">
<label for="starType">Star Type:</label>
<input type="text" id="starType" placeholder="e.g. M8, K5, G2, F4, A8" autocomplete="off">
<p class="hint">Enter a type: M0-M9, K0-K9, G0-G9, F0-F9, A0-A9</p>
</div>
<div class="input-group">
<label for="temp">Temperature (K):</label>
<input type="number" id="temp" placeholder="e.g. 5530" min="1500" max="10000">
</div>
<div class="input-group">
<label for="distance">Distance (AU):</label>
<input type="number" id="distance" placeholder="e.g. 6.26" min="0.01" max="100" step="0.01">
</div>
<button class="btn" onclick="calc()">Calculate</button>
<div id="result" class="result">
<h2>Estimated Heat</h2>
<div id="heatValue" class="heat-value"></div>
<div id="zone" class="zone"></div>
<div class="details">
<p><strong>Range:</strong> <span id="range"></span></p>
<p><strong>Confidence:</strong> <span id="confidence"></span></p>
</div>
<div id="warning" class="warning" style="display:none;"></div>
</div>
</div>
<script>
function calc(){const a=document.getElementById('starType').value.trim().toUpperCase(),b=parseFloat(document.getElementById('temp').value),c=parseFloat(document.getElementById('distance').value);if(!b||!c)return void alert('Please enter temperature and distance!');if(a&&!/^[MKGFA]\d$/.test(a))return void alert('Invalid star type! Use format like: M8, K5, G2, F4, A8');const d=a?a.charAt(0):getS(b);let e;if('M'===d&&c<1){const a=b/3e3,d=Math.exp(-2.8*c),f=65*a*d;e=f}else if('K'===d&&c<.7){const a=b/3e3,d=Math.exp(-2*c),f=115*a*d;e=f}else if('G'===d&&c<.5){const a=b/3e3,d=Math.exp(-2.2*c),f=80*a*d;e=f}else if(c<.3&&c>=.15){const f=b/3e3;let g=18;'M'===d&&b<3200&&(g=15);const h=('M'===d?g:1.1*g)*f/Math.sqrt(c),i=Math.pow(f,3.5)/Math.pow(c,2);let j=.75;'K'===d?j=.75:'G'===d?j=.7:'F'===d?j=.72:'A'!==d&&'B'!==d||(j=.75);const k=i*35*j,l=(c-.15)/.15;e=h*(1-l)+k*l}else{const f=b/3e3,g=Math.pow(f,3.5)/Math.pow(c,2);let h=35,i=1;if('M'===d)b<2800?i=c<1?.65:c<3?.8:1:b<3500?i=c<1?.72:c<3?.85:1:i=c<.2?.75:c<1?.78:c<3?.75:c<5?.85:1;else if('K'===d)i=c<1?.75:c<1.5?.73:c<3?.85:1;else if('G'===d)i=c<2?.7:c<3?.68:c<5?.85:1;else if('F'===d)i=c<3?.72:c<5?.8:c<8?.88:1;else if('A'===d||'B'===d)i=c<5?.75:c<10?.9:c<15?.85:1;e=g*h*i,c>20&&e<.5&&(e*=.5),c>30&&e<.3&&(e*=.4)}e=Math.round(10*e)/10;const f=Math.max(.1,Math.round(.85*e*10)/10),g=Math.round(1.15*e*10)/10;let h,i,j;e<30?(h='Safe',i='zone-safe',j='🟢'):e<60?(h='High Load',i='zone-moderate',j='🟡'):e<80?(h='Dangerous',i='zone-dangerous',j='🔴'):(h='Supercritical',i='zone-critical',j='☠️');let k;k=c<1&&'M'===d?'🟡 Medium (exponential model)':c>10||'M'===d&&c>5?'🟢 High':c<.5||e>70?'🟡 Medium':'🟢 Good',document.getElementById('heatValue').textContent=e.toFixed(1),document.getElementById('zone').textContent=j+' '+h,document.getElementById('zone').className='zone '+i,document.getElementById('range').textContent=f+' - '+g,document.getElementById('confidence').textContent=k;const l=document.getElementById('warning');e>=60?(l.innerHTML=e>=80?'⚠️ <strong>SUPERCRITICAL!</strong> Easily reaches 150 limit after jump!':'⚠️ <strong>DANGEROUS!</strong> Jump distance limited, short jumps recommended.',l.style.display='block'):l.style.display='none',document.getElementById('result').style.display='block'}function getS(a){return a<3900?'M':a<5200?'K':a<6e3?'G':a<7500?'F':'A'}['starType','temp','distance'].forEach(a=>{document.getElementById(a).addEventListener('keypress',function(a){'Enter'===a.key&&calc()})});
</script>
</body>
</html>
