<script>
const API_SINGLE = 'https://systems-test.heatsense.workers.dev/api/system';
const API_BATCH = 'https://systems-test.heatsense.workers.dev/api/systems';

document.getElementById('searchBtn').addEventListener('click', searchSystems);

async function searchSystems() {
  const input = document.getElementById('systemInput').value.trim();
  const btn = document.getElementById('searchBtn');
  const resultDiv = document.getElementById('result');
  const errorDiv = document.getElementById('error');

  resultDiv.style.display = 'none';
  errorDiv.style.display = 'none';

  if (!input) {
    showError('Please enter at least one system name');
    return;
  }

  const systemNames = parseSystemInput(input);
  document.getElementById('systemInput').value = systemNames.join(', ');

  if (systemNames.length === 0) {
    showError('No valid system names found');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Checking...';
  resultDiv.innerHTML = `<div class="loading">🔍 Checking ${systemNames.length} system(s)...</div>`;
  resultDiv.style.display = 'block';

  try {
    let results = [];
    let model = 'arctangent-v1.0'; // Fallback

    if (systemNames.length > 1) {
      // Batch request for multiple systems
      const response = await fetch(API_BATCH, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ names: systemNames })
      });

      if (!response.ok) {
        throw new Error(`Batch error: ${response.status}`);
      }

      const data = await response.json();
      console.log('Batch response:', data); // Debug

      for (const s of data.systems) {
        if (s.error) {
          results.push({ name: s.name, error: s.error });
          continue;
        }

        const normalizedSystem = {
          id: s.id,
          name: s.name,
          star_class: s.class,
          temperature: s.temp,
          radius_km: s.radius_km,
          status: s.status,
          coords: s.coords,
          coldest_point: {
            distance_au: s.coldest.au,
            distance_ls: s.coldest.ls,
            heat: s.coldest.heat
          }
        };

        results.push({ name: s.name, system: normalizedSystem, model: data.model || model });
      }
    } else {
      // Single system fallback
      const name = systemNames[0];
      const url = `${API_SINGLE}?name=${encodeURIComponent(name)}`;
      const response = await fetch(url);

      if (!response.ok) {
        throw new Error(`Single error: ${response.status}`);
      }

      const data = await response.json();
      console.log('Single response:', data); // Debug

      if (data.error) {
        results.push({ name, error: data.error });
      } else {
        const s = data.system;
        const normalizedSystem = {
          id: s.id,
          name: s.name,
          star_class: s.class,
          temperature: s.temp,
          radius_km: s.radius_km,
          status: s.status,
          coords: s.coords,
          coldest_point: {
            distance_au: s.coldest.au,
            distance_ls: s.coldest.ls,
            heat: s.coldest.heat
          }
        };

        results.push({ name, system: normalizedSystem, model: data.model || model });
      }
    }

    if (results.length === 1 && !results[0].error) {
      displayResult(results[0].system, results[0].model);
    } else {
      displayMultipleResults(results);
    }
  } catch (error) {
    console.error('Search error:', error);
    showError(error.message);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Check Heat';
  }
}

function parseSystemInput(input) {
  const systems = new Set();
  let text = input;

  const temp = document.createElement('div');
  temp.innerHTML = text;
  text = temp.textContent || temp.innerText || text;

  text = text
    .replace(/→/g, ' ')
    .replace(/\|/g, ' ')
    .replace(/\*/g, ' ')
    .replace(/Gate:|SmartGate:|Jump:/gi, ' ')
    .replace(/\([^)]*\)/g, ' ')
    .replace(/\[[^\]]*\]/g, ' ')
    .replace(/<[^>]*>/g, ' ')
    .replace(/[\d]+\.[\d]+/g, ' ')
    .replace(/\s+/g, ' ');

  const regex = /\b[A-Z0-9]{2,4}-[A-Z0-9]{2,4}\b/gi;
  const matches = text.match(regex);

  if (matches) {
    for (const m of matches) {
      systems.add(m.toUpperCase());
    }
  }

  return Array.from(systems);
}

function displayResult(system, model) {
  const resultDiv = document.getElementById('result');
  const isTrap = system.coldest_point.heat >= 85;

  const statusConfig = {
    'SAFE': { class: 'status-safe', emoji: '✅' },
    'MODERATE': { class: 'status-moderate', emoji: '⚠️' },
    'DANGEROUS': { class: 'status-dangerous', emoji: '🔥' },
    'CRITICAL': { class: 'status-critical', emoji: '☠️' }
  };

  const config = statusConfig[system.status] || statusConfig['SAFE'];

  let trapWarningHTML = '';
  if (isTrap) {
    trapWarningHTML = `
      <div class="trap-warning">
        <div class="trap-title">⚠️ IT'S A TRAP?! ⚠️</div>
        <div class="trap-message">
          Even at the coldest accessible point (${system.coldest_point.distance_au.toFixed(2)} AU), 
          this system has dangerously high heat (${system.coldest_point.heat.toFixed(1)})!<br>
          <strong>WARNING:</strong> You may not be able to escape if your ship overheats.
        </div>
      </div>
    `;
  }

  resultDiv.innerHTML = `
    <div class="system-name">${system.name}</div>
    
    <div class="heat-display">
      <div class="heat-value">${system.coldest_point.heat.toFixed(1)}</div>
      <div class="heat-label">Heat Units at Coldest Point</div>
    </div>
    
    <div class="status-badge ${config.class}">
      ${config.emoji} ${system.status}
    </div>
    
    ${trapWarningHTML}
    
    <div class="details">
      <div class="detail-row">
        <span class="detail-label">Star Type:</span>
        <span class="detail-value">${system.star_class} (${system.temperature}K)</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Star Radius:</span>
        <span class="detail-value">${(system.radius_km / 1000000).toFixed(1)} M km</span>
      </div>
      <div class="detail-row">
        <span class="detail-label">Coldest Point:</span>
        <span class="detail-value">${system.coldest_point.distance_au.toFixed(2)} AU (${system.coldest_point.distance_ls.toFixed(0)} LS)</span>
      </div>
    </div>
    
    <div class="info-box">
      Read more: <a href="https://thoughtfolio.xyz/All+to+Avoid+Heat+Traps%2C+Exponential+Heat-Signature+Decay+Model" target="_blank" style="color:#6cf">Ergod's Research Paper</a>
    </div>
  `;
  
  resultDiv.style.display = 'block';
}

/**
 * Renders route jump analysis table
 * @param {Array} routeJumps
 * @returns {string} HTML
 */
function renderRouteJumps(routeJumps) {
  if (!routeJumps || !routeJumps.length) return '';

  let html = `
    <h2 style="margin-top:30px">Route Jump Analysis</h2>
    <table class="route-table">
      <thead>
        <tr>
          <th>Jump</th>
          <th>Distance (LY)</th>
          <th>Low Heat</th>
          <th>Jump Heat</th>
          <th>Total After</th>
          <th>Status</th>
          <th>Reason</th>
        </tr>
      </thead>
      <tbody>
  `;

  for (const j of routeJumps) {
    let status = 'OK';
    let color = '#aaffaa';

  if (j.canJump === null) {
    status = 'N/A';
    color = '#888';
} 
  else if (j.totalAfterJump >= 149) {
    status = 'FAIL';
    color = '#ff5555';
} 
  else if (j.warning) {
    status = 'WARN';
    color = '#ffaa66';
}

    html += `
      <tr>
        <td><strong>${j.from}</strong> → ${j.to}</td>
        <td>${j.distanceLY.toFixed(2)}</td>
        <td>${j.lowHeat.toFixed(1)}</td>
        <td>${j.totalAfterJump === null ? 'N/A' : j.totalAfterJump.toFixed(2)}
        <td style="color:${color};font-weight:bold">
          ${j.totalAfterJump.toFixed(2)}
        </td>
        <td style="color:${color};font-weight:bold">
          ${status}
        </td>
        <td style="font-size:0.9em;color:#ccc">
          ${j.reason || '-'}
        </td>
      </tr>
    `;
  }

  html += `
      </tbody>
    </table>
  `;

  return html;
}

function displayMultipleResults(results) {
  const systems = results
    .filter(r => !r.error)
    .map(r => r.system);

  const routeJumps = calculateRouteJumps(systems, {
    hullMass: Number(hullMassBase.value),
    totalHullMass: Number(totalHullMass.value),
    C: Number(baseCInput.value)
  });
  const jumpMap = mapRouteJumpsBySystem(routeJumps);

  const resultDiv = document.getElementById('result');
  const successCount = results.filter(r => !r.error).length;
  const trapCount = results.filter(
    r => !r.error && r.system?.coldest_point?.heat >= 85
  ).length;

  const hullMass = Number(hullMassBase.value);
  const totalHullMass = Number(totalHullMass.value);
  const C = Number(baseCInput.value);

  const hasShipData = hullMass > 0 && totalHullMass > 0 && C > 0;

  let html = `
    <h2>Route Heat Check</h2>

    ${
      !hasShipData
        ? `<div style="margin:6px 0 10px;color:#aaa;font-size:0.9em">
             ▸ Select ship to evaluate jump feasibility
           </div>`
        : ''
    }

    <p style="text-align:center;margin:15px 0;font-size:1.1em;color:#ffaa77">
      ${successCount} / ${results.length} systems found
      ${trapCount > 0
        ? `| <span style="color:#ff6666">⚠️ ${trapCount} TRAP(s) detected!</span>`
        : ''}
    </p>

    <table class="route-table">
      <thead>
        <tr>
          <th>System</th>
          <th>Star</th>
          <th>Heat</th>
          <th>Status</th>
          <th>Jump Heat</th>
          <th>Total After</th>
          <th>Jump</th>
        </tr>
      </thead>
      <tbody>
  `;

  for (const result of results) {
    if (result.error) {
      const jump = jumpMap[result.name];

      html += `
        <tr>
          <td>${result.name}</td>
          <td colspan="3" style="color:#ff6666">❌ ${result.error}</td>
          <td>${jump?.jumpHeat != null ? jump.jumpHeat.toFixed(2) : 'N/A'}</td>
          <td>${jump?.totalAfterJump != null ? jump.totalAfterJump.toFixed(2) : 'N/A'}</td>
          <td style="color:#888">N/A</td>
        </tr>
      `;
      continue;
    }

    const sys = result.system;
    const jump = jumpMap[sys.name];
    const isTrap = sys.coldest_point.heat >= 85;

    let jumpStatus = 'N/A';
    let jumpColor = '#888';

    if (jump && jump.canJump !== null) {
      if (jump.canJump) {
        jumpStatus = 'OK';
        jumpColor = '#7CFF7C';
      } else {
        jumpStatus = 'FAIL';
        jumpColor = '#FF6B6B';
      }
    }

    html += `
      <tr>
        <td><strong>${sys.name}</strong></td>
        <td>${sys.star_class} (${sys.temperature}K)</td>

        <td class="heat-cell" style="color:${
          sys.coldest_point.heat >= 70
            ? '#ff6666'
            : sys.coldest_point.heat >= 30
              ? '#ffaa66'
              : '#aaffaa'
        }">
          ${sys.coldest_point.heat.toFixed(1)}
        </td>

        <td>
          ${sys.status}
          ${isTrap ? '<span class="trap-indicator trap-yes">⚠️ TRAP!</span>' : ''}
        </td>

        <td>${jump?.jumpHeat != null ? jump.jumpHeat.toFixed(2) : 'N/A'}</td>
        <td>${jump?.totalAfterJump != null ? jump.totalAfterJump.toFixed(2) : 'N/A'}</td>

        <td style="font-weight:bold;color:${jumpColor}">
          ${jumpStatus}
        </td>
      </tr>
    `;
  }

  html += `</tbody></table>`;

  resultDiv.innerHTML = html;
  resultDiv.style.display = 'block';
}


function showError(message) {
  const errorDiv = document.getElementById('error');
  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'none';
  errorDiv.innerHTML = `<strong>❌ Error:</strong> ${message}<br><small>Make sure the system name is correct. Try exact names like "O3H-1FN".</small>`;
  errorDiv.style.display = 'block';
}

// dropdown feltöltése
function populateShips() {
  shipSelect.innerHTML = '';
  SHIPS.forEach(s => {

    opt.value = s.name;
    opt.textContent = s.name;
    shipSelect.appendChild(opt);
  });

}

// kiválasztott hajó alkalmazása
function applyShip(ship) {
  hullBase.value = ship.hullMass;
  totalHull.value = ship.hullMass;
  baseCInput.dataset.base = ship.baseC;
  updateCFromSkill();
}

// skill → C számítás
function updateCFromSkill() {
  const skill = Number(skillSlider.value);
  skillValue.textContent = skill;
  skillBonus.textContent = skill * 2;

  const baseC = Number(baseCInput.dataset.base);
  baseCInput.value = (baseC * (1 + skill * 0.02)).toFixed(3);
}

skillSlider.addEventListener('input', updateCFromSkill);

shipSelect.addEventListener('change', () => {
  const ship = SHIPS.find(s => s.name === shipSelect.value);
  if (ship) applyShip(ship);
});

/**
 * Calculates jump heat and jump feasibility between two systems
 *
 * @param {number} lowHeat        - coldest heat of the starting system
 * @param {number} distanceLY     - distance in light-years
 * @param {number} totalHullMass  - effective ship mass (with cargo etc.)
 * @param {number} hullMass       - base hull mass of the ship
 * @param {number} C              - ship C value (after skill bonus)
 *
 * @returns {object}
 */
function calculateJumpHeat({
  lowHeat,
  distanceLY,
  totalHullMass,
  hullMass,
  C
}) {
  const jumpHeat =
    (3 * totalHullMass * distanceLY) /
    (C * hullMass);

  const totalAfterJump = lowHeat + jumpHeat;

  const warning = lowHeat > 90;
  const canJump = totalAfterJump < 149;

  return {
    jumpHeat,
    totalAfterJump,
    warning,
    canJump
  };
}

/**
 * Calculates jump-by-jump heat data for a route
 * @param {Array} systems - array of system objects in route order
 * @returns {Array}
 */
function calculateRouteJumps(systems, shipParams) {
  const results = [];
  const {
  hullMass,
  totalHullMass,
  C
}  = shipParams || {};

const hasShipData =
  hullMass > 0 &&
  totalHullMass > 0 &&
  C > 0;


const hasShipData =
  hullMass > 0 &&
  totalHullMass > 0 &&
  C > 0;


  for (let i = 0; i < systems.length - 1; i++) {
    const from = systems[i];
    const to = systems[i + 1];

    const distanceLY = calculateDistanceLY(from, to);

let jump = {
  jumpHeat: null,
  totalAfterJump: null,
  warning: from.coldest_point.heat > 90,
  canJump: null
};

  if (hasShipData) {
  jump = calculateJumpHeat({
    lowHeat: from.coldest_point.heat,
    distanceLY,
    totalHullMass,
    hullMass,
    C
  });
}

    results.push({
      from: from.name,
      to: to.name,
      distanceLY,
      lowHeat: from.coldest_point.heat,
      ...jump
    });

    // HARD STOP on failed jump
    if (hasShipData && jump.canJump === false) break;
  }

  return results;
}

function mapRouteJumpsBySystem(routeJumps) {
  const map = {};
  routeJumps.forEach(j => {
    map[j.from] = j;
  });
  return map;
}
